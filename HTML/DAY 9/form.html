<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>
</head>
<body>

<center>
    <h1>Job Application Form</h1>
</center>

    <label>Full Name:</label><br>
    <input type="text" name="fullname" placeholder="Enter your full name"><br><br>

    <label>Email:</label><br>
    <input type="email" name="email" placeholder="Enter your email"><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" placeholder="Enter password"><br><br>

    <label>Phone Number:</label><br>
    <input type="tel" name="phone" placeholder="Enter mobile number"><br><br>

    <label>Date of Birth:</label><br>
    <input type="date" name="dob"><br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <input type="radio" name="gender" value="Other"> Other
    <br><br>

    <label>Skills:</label><br>
    <input type="checkbox" name="skills" value="HTML"> HTML
    <input type="checkbox" name="skills" value="CSS"> CSS
    <input type="checkbox" name="skills" value="JavaScript"> JavaScript
    <input type="checkbox" name="skills" value="Java"> Java
    <br><br>

    <label>Highest Qualification:</label><br>
    <select name="qualification">
        <option>Select Qualification</option>
        <option>10th</option>
        <option>12th</option>
        <option>Diploma</option>
        <option>B.E.</option>
        <option>B.Tech</option>
        <option>M.E.</option>
    </select>
    <br><br>

    <label>Preferred Location:</label><br>
    <select name="location">
        <option>Choose Location</option>
        <option>Chennai</option>
        <option>Bangalore</option>
        <option>Hyderabad</option>
        <option>Pune</option>
    </select>
    <br><br>

    <label>Address:</label><br>
    <textarea name="address" rows="5" cols="35" placeholder="Enter your address"></textarea>
    <br><br>

    <label>Upload Resume:</label><br>
    <input type="file" name="resume"><br><br>

    <input type="submit" value="Apply">
    <input type="reset" value="Clear">

</form>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRATIONFORM</title>
</head>
<body>
    <center>
    <h1>JOB APPLICATION FORM</h1>
    </center>
    <label>Full name:</label><br><br>
    <input type="text" name="full name"
    placeholder="enter your full name"><br><br>
    <label> Email :</label><br><br>
    <input type="text" name="Email"  
    placeholder="enter your Email"><br><br>
    <label> password </label><br><br>
    <input type="text" name="password"
    placeholder="enter your password"><br><br>
    <label> phone number</label><br><br>
    <input type="phonenumber"
    placeholder="enter the mobile number" name="phonenumber"><br><br>
    <label> date of birth</label><br><BR>
    <input type="text" name="dob"
    placeholder="enter the DOB"><br><br>
    <label> genter</label><br>
    <input type="radio" name="genter" value="male">male
    <input type="radio" name="genter" value="female">female<br><br>
    <label> skills</label>
    <input type="checkbox" name="skills" value="HTML">HTML
    <input type="checkbox" name="skills" value="CSS">CSS
    <input type="checkbox" name="skills" value="JAVASCRIPT">JAVASCRIPT
    <input type="checkbox" name="skills" value="JAVA"> JAVA<br><br>
    <label>highest qualifiction</label>
    <select name="qualification">
    <option> select qualification"</option>
    <option> 10th</option>
    <option> 12th</option>
    <option> be</option>
    <option> b.tech</option>
    <option> ME</option>
    </select><br><br>
    <label>address</label>
    <textarea name="address" rows="5" cols="35"
    placeholder="enter the address"></textarea><br><br>
    <label> resume</label>
    <input type="file" name="resume"><br><br>
    <input type="submit" value="apply">
    <input type="reset" value="clear">


</body>
</html>

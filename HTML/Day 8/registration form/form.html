<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

<center>
    <h1>Registration Form</h1>
</center>


    <label>First Name:</label><br>
    <input type="text" name="firstname" placeholder="Enter First Name"><br><br>

    <label>Last Name:</label><br>
    <input type="text" name="lastname" placeholder="Enter Last Name"><br><br>

    <label>Email:</label><br>
    <input type="email" name="email" placeholder="Enter Email"><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" placeholder="Enter Password"><br><br>

    <label>Confirm Password:</label><br>
    <input type="password" name="confirm_password" placeholder="Confirm Password"><br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <input type="radio" name="gender" value="Other"> Other
    <br><br>

    <label>Date of Birth:</label><br>
    <input type="date" name="dob"><br><br>

    <label>Mobile Number:</label><br>
    <input type="tel" name="mobile" placeholder="Enter Mobile Number"><br><br>

    <label>Address:</label><br>
    <textarea name="address" rows="4" cols="30" placeholder="Enter Address"></textarea><br><br>

    <label>City:</label><br>
    <input type="text" name="city" placeholder="Enter City"><br><br>

    <label>State:</label><br>
    <input type="text" name="state" placeholder="Enter State"><br><br>

    <label>Country:</label><br>
    <select name="country">
        <option>India</option>
        <option>USA</option>
        <option>UK</option>
        <option>Canada</option>
        <option>Australia</option>
    </select><br><br>

    <label>Hobbies:</label><br>
    <input type="checkbox" name="hobby" value="Reading"> Reading
    <input type="checkbox" name="hobby" value="Sports"> Sports
    <input type="checkbox" name="hobby" value="Music"> Music
    <br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Reset">

</form>

</body>
</html>
